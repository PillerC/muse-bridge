{{template "head" .}}
<h1>新建桥</h1>
<p class="sub">一座桥连接一个 Telegram 机器人和一个 Muse 实例。机器人 token 会加密存储，Muse 永远看不到它。</p>

<form class="card" method="post" action="/bridges">
  <label>桥名字</label>
  <input type="text" name="name" placeholder="例如：小助手 / 客服一号" required>

  <label>机器人 token（从 @BotFather 获取）</label>
  <input type="text" name="bot_token" placeholder="123456789:AA..." required autocomplete="off">

  <label>允许的 Telegram 用户 ID（可留空，逗号分隔，私聊 @userinfobot 获取ID）。</label>
  <input type="text" name="allowed_user_ids" placeholder="留空 = 第一个发消息的人自动绑定" inputmode="numeric">

  <label>接收 Telegram 更新的方式</label>
  <select name="mode">
    <option value="webhook" {{if eq .Data.DefaultMode "webhook"}}selected{{end}}>webhook（需要域名 + HTTPS）</option>
    <option value="poll" {{if eq .Data.DefaultMode "poll"}}selected{{end}}>长轮询（不需要开放端口）</option>
  </select>
  <p class="sub" style="margin:6px 0 0">
    webhook 由 Telegram 主动推给桥，长轮询由桥主动去拉。这只影响桥怎么从 Telegram 取消息，
    Muse 侧固定用 <code>/pending-count</code> + <code>/poll</code> 拉取，与这里无关。
  </p>

  <div class="row" style="margin-top:20px">
    <button class="btn primary" type="submit">创建并校验 token</button>
    <a class="btn" href="/">取消</a>
  </div>
</form>
{{template "foot" .}}
