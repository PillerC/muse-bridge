<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>登录 · Muse Bridge</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;color:#1c1f23;
      padding:20px;
      font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    /* 固定 340px 在 320px 宽的手机上会横向溢出，用 min() 兜住。 */
    .box{width:min(340px,100%);background:#fff;border:1px solid #e3e6ea;border-radius:14px;padding:26px 24px}
    h1{font-size:19px;margin:0 0 4px}
    p{color:#6b7280;font-size:13px;margin:0 0 18px}
    label{display:block;font-size:13px;color:#6b7280;margin:12px 0 6px}
    input{width:100%;padding:9px 11px;border:1px solid #e3e6ea;border-radius:8px;font-size:14px;
      font-family:inherit;background:#fff;color:#1c1f23}
    input:focus{outline:2px solid #eef3ff;border-color:#2563eb}
    button{width:100%;margin-top:18px;padding:10px;border:0;border-radius:8px;background:#2563eb;
      color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
    .err{background:#fdecec;color:#b91c1c;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:6px}
    @media(max-width:720px){
      .box{padding:22px 18px}
      /* 16px 以下 iOS 聚焦会自动放大页面 */
      input{font-size:16px}
    }
  </style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1>Muse Bridge</h1>
    <p>输入管理员账号，管理桥、令牌和聊天记录</p>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <label>用户名</label>
    <input type="text" name="username" autocomplete="username" autofocus required>
    <label>密码</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
  </form>
</body>
</html>
