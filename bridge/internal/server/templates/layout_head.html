{{define "head"}}<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Muse Bridge</title>
  <style>
    :root{
      --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ea; --text:#1c1f23;
      --muted:#6b7280; --accent:#2563eb; --accent-weak:#eef3ff;
      --ok:#15803d; --ok-bg:#e9f7ef; --warn:#a16207; --warn-bg:#fdf6e3;
      --err:#b91c1c; --err-bg:#fdecec; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
    .bar{display:flex;align-items:center;gap:20px;height:56px}
    .brand{font-weight:650;letter-spacing:.2px}
    .brand span{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
    nav{display:flex;gap:4px;margin-left:auto}
    nav a{padding:6px 12px;border-radius:7px;color:var(--text);font-size:14px}
    nav a:hover{background:var(--bg);text-decoration:none}
    nav a.on{background:var(--accent-weak);color:var(--accent)}
    main{padding:28px 0 60px}
    h1{font-size:22px;margin:0 0 4px}
    h2{font-size:16px;margin:0 0 12px}
    .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
    .grid{display:grid;gap:12px}
    .stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
    .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
    .stat b{display:block;font-size:22px;font-weight:650;line-height:1.3}
    .stat span{color:var(--muted);font-size:12px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
    th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    tr:last-child td{border-bottom:0}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;line-height:1.7}
    .pill.ok{background:var(--ok-bg);color:var(--ok)}
    .pill.warn{background:var(--warn-bg);color:var(--warn)}
    .pill.err{background:var(--err-bg);color:var(--err)}
    .pill.mute{background:#f0f2f5;color:var(--muted)}
    code,.mono{font-family:var(--mono);font-size:13px}
    .token{background:#f7f8fa;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;
      word-break:break-all;font-family:var(--mono);font-size:13px}
    label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
    input[type=text],input[type=password],input[type=search],select,textarea{
      width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;
      background:#fff;color:var(--text);font-family:inherit}
    input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
    .btn{display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
      background:#fff;color:var(--text);font-size:14px;cursor:pointer;font-family:inherit}
    .btn:hover{background:var(--bg)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{filter:brightness(.95)}
    .btn.danger{color:var(--err);border-color:#f3c7c7}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .msg{padding:10px 14px;border-radius:9px;margin-bottom:16px;font-size:14px}
    .msg.ok{background:var(--ok-bg);color:var(--ok)}
    .msg.err{background:var(--err-bg);color:var(--err)}
    .chat{display:flex;flex-direction:column;gap:10px}
    .bubble{max-width:78%;padding:9px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
    .bubble.out{align-self:flex-end;background:var(--accent-weak);border-color:#d8e3ff}
    .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
    .empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:760px){.split{grid-template-columns:1fr}.bubble{max-width:92%}}
    .list{list-style:none;margin:0;padding:0}
    .list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
    .list li:last-child{border-bottom:0}
    .list .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    footer{color:var(--muted);font-size:12px;text-align:center;padding:20px 0 40px}
  </style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">Muse Bridge<span>Telegram ↔ Muse</span></div>
    <nav>
      <a href="/admin" class="{{if eq .Active "dashboard"}}on{{end}}">总览</a>
      <a href="/admin/bridges/new" class="{{if eq .Active "new"}}on{{end}}">新建桥</a>
      <a href="/admin/export?bridge_id=0" class="{{if eq .Active "export"}}on{{end}}">导出</a>
      {{if .Admin}}<form method="post" action="/admin/logout" style="margin:0"><button class="btn" style="padding:6px 10px">退出</button></form>{{end}}
    </nav>
  </div>
</header>
<main class="wrap">
{{if .Flash}}<div class="msg {{.FlashKind}}">{{.Flash}}</div>{{end}}
{{end}}
