{{define "head"}}<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{.Title}} · Muse Bridge</title>
  <script src="/static/copy.js" defer></script>
  <style>
    :root{
      --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ea; --text:#1c1f23;
      --muted:#6b7280; --accent:#2563eb; --accent-weak:#eef3ff;
      --ok:#15803d; --ok-bg:#e9f7ef; --warn:#a16207; --warn-bg:#fdf6e3;
      --err:#b91c1c; --err-bg:#fdecec; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      /* 手机常开深色模式：不声明 light 的话，输入框和下拉会被系统改成深底，
         而页面底色仍是浅的，深底深字直接看不清。 */
      color-scheme:light;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--text);overflow-wrap:break-word;
      font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
    .bar{display:flex;align-items:center;gap:20px;height:56px}
    .brand{font-weight:650;letter-spacing:.2px;white-space:nowrap}
    .brand span{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
    /* 窄屏时导航可能装不下：让它自己横向滚动，而不是把品牌名挤成两行。
       min-width:0 是关键，flex 子项默认不会缩到内容宽度以下。 */
    nav{display:flex;gap:4px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav a{padding:6px 12px;border-radius:7px;color:var(--text);font-size:14px;white-space:nowrap;flex:0 0 auto}
    nav a:hover{background:var(--bg);text-decoration:none}
    nav a.on{background:var(--accent-weak);color:var(--accent)}
    nav form{flex:0 0 auto;margin:0}
    main{padding:28px 0 60px}
    h1{font-size:22px;margin:0 0 4px}
    h2{font-size:16px;margin:0 0 12px}
    .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
    .grid{display:grid;gap:12px}
    .stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
    .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
    .stat b{display:block;font-size:22px;font-weight:650;line-height:1.3}
    .stat span{color:var(--muted);font-size:12px}
    /* 表格放在横向滚动容器里：列多的表宁可在卡片内左右滑，
       也不要把 6 列压成每列 50px 然后一个字一行。 */
    .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
    th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
    tr:last-child td{border-bottom:0}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;line-height:1.7;white-space:nowrap}
    .pill.ok{background:var(--ok-bg);color:var(--ok)}
    .pill.warn{background:var(--warn-bg);color:var(--warn)}
    .pill.mute{background:#f0f2f5;color:var(--muted)}
    code,.mono{font-family:var(--mono);font-size:13px}
    code{overflow-wrap:anywhere}
    .token{background:#f7f8fa;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;
      word-break:break-all;font-family:var(--mono);font-size:13px}
    /* 一键复制那两块：标题和按钮同一行，内容是只读的等宽块。
       提示词要能看清换行，用 textarea 而不是 div——它也天生可全选。 */
    .copyhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 7px}
    .copyhead.first{margin-top:0}
    .copyhead .lbl{margin:0;font-size:13px;color:var(--muted)}
    textarea.copybox{width:100%;min-height:230px;padding:11px 12px;border:1px solid var(--line);
      border-radius:8px;background:#f7f8fa;color:var(--text);resize:vertical;
      font-family:var(--mono);font-size:12.5px;line-height:1.65}
    .copybtn{white-space:nowrap;flex:0 0 auto}
    /* 提示词很长，默认折叠起来只留一行：多数时候人只是要复制，
       不需要先读两屏文字。用原生 details，不额外写脚本。 */
    .fold>summary{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;
      border:1px solid var(--line);border-radius:8px;background:#fff;
      font-size:13px;color:var(--accent);cursor:pointer;list-style:none;user-select:none}
    .fold>summary::-webkit-details-marker{display:none}
    .fold>summary:hover{background:var(--bg)}
    .fold .fold-act{color:var(--muted);font-size:12px}
    .fold .fold-act::before{content:"· 展开"}
    .fold[open] .fold-act::before{content:"· 收起"}
    .fold[open]>summary{margin-bottom:7px}
    label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
    input[type=text],input[type=password],input[type=search],select,textarea{
      width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;
      background:#fff;color:var(--text);font-family:inherit}
    input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
    .btn{display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
      background:#fff;color:var(--text);font-size:14px;cursor:pointer;font-family:inherit;line-height:1.4}
    .btn:hover{background:var(--bg)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{filter:brightness(.95)}
    .btn.danger{color:var(--err);border-color:#f3c7c7}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    /* 设置卡底部的操作区：和上面的表单分开一层，
       暂停、删除并排放，删除永远挨着暂停而不是孤零零挂在页尾。 */
    .danger-zone{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
    .msg{padding:10px 14px;border-radius:9px;margin-bottom:16px;font-size:14px}
    .msg.ok{background:var(--ok-bg);color:var(--ok)}
    .msg.err{background:var(--err-bg);color:var(--err)}
    .chat{display:flex;flex-direction:column;gap:10px}
    /* 白空格只在 .body 上保留：放在 .bubble 上会把模板缩进也渲染成空行，
       每条消息顶上凭空多出两行。 */
    .bubble{max-width:78%;padding:9px 13px;border-radius:12px;background:#fff;border:1px solid var(--line)}
    .bubble.out{align-self:flex-end;background:var(--accent-weak);border-color:#d8e3ff}
    .bubble .body{white-space:pre-wrap;word-break:break-word}
    .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
    .empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .list{list-style:none;margin:0;padding:0}
    .list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
    .list li:last-child{border-bottom:0}
    .list .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    @media(max-width:760px){
      .split{grid-template-columns:1fr}
      .bubble{max-width:92%}
    }

    /* ---------- 手机 ---------- */
    @media(max-width:720px){
      .wrap{padding:0 14px}
      .bar{height:52px;gap:10px}
      .brand{font-size:15px}
      .brand span{display:none}      /* 副标题纯装饰，手机上只会把品牌挤成两行 */
      nav{gap:2px}
      nav a{padding:7px 9px;font-size:13px}
      nav .btn{padding:6px 9px;font-size:13px}
      main{padding:18px 0 40px}
      h1{font-size:20px}
      h2{font-size:15px}
      .sub{font-size:12.5px;margin-bottom:16px}
      .card{padding:14px;border-radius:10px;margin-bottom:12px}
      .stats{grid-template-columns:repeat(2,1fr);gap:8px}
      .stat{padding:11px 12px}
      .stat b{font-size:19px}
      th,td{padding:9px 6px;font-size:13px}
      th{font-size:11px}
      /* 16px 以下输入框会让 iOS 在聚焦时自动放大整个页面，
         缩回去之后版式看起来就是"错乱"的。 */
      input[type=text],input[type=password],input[type=search],select,textarea{font-size:16px;padding:10px 11px}
      .btn{padding:9px 12px}
      .row{gap:8px}
      .list li{flex-wrap:wrap;gap:4px}
      /* 会话标题允许折行，别再截成 "…"；右侧统计单独占一行 */
      .list .grow{flex:1 1 100%;white-space:normal;overflow:visible;text-overflow:clip}
      .list .grow + span{margin-left:auto;text-align:right}
      .bubble{max-width:96%}
      /* 元信息行在手机上本来就长，字号和胶囊再收一点，能省掉两三行 */
      .meta{font-size:10.5px;line-height:1.5}
      .meta .pill{font-size:10.5px;padding:1px 6px}

      /* 提示词是只读的，不参与上面那条 16px 防缩放规则：
         真按 16px 排，一段说明能占满两屏。 */
      textarea.copybox{font-size:12px;min-height:210px}
      .copyhead{margin:16px 0 6px}
    }
  </style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">Muse Bridge<span>Telegram ↔ Muse</span></div>
    <nav>
      <a href="/" class="{{if eq .Active "dashboard"}}on{{end}}">总览</a>
      <a href="/bridges/new" class="{{if eq .Active "new"}}on{{end}}">新建桥</a>
      <a href="/export" class="{{if eq .Active "export"}}on{{end}}">导出</a>
      <a href="/account" class="{{if eq .Active "account"}}on{{end}}">账号</a>
      {{if .Admin}}<form method="post" action="/logout"><button class="btn" style="padding:6px 10px">退出</button></form>{{end}}
    </nav>
  </div>
</header>
<main class="wrap">
{{if .Flash}}<div class="msg {{.FlashKind}}">{{.Flash}}</div>{{end}}
{{end}}
