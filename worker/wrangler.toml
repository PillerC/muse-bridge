name = "telegram-queue"
main = "src/index.js"
compatibility_date = "2025-01-01"

# D1 绑定: 先执行 wrangler d1 create telegram-queue,
# 把返回的 database_id 填到下面
[[d1_databases]]
binding = "DB"
database_name = "telegram-queue"
database_id = "YOUR_D1_DATABASE_ID"

[vars]
# Bot 用户名, 不带 @, 例如 my_muse_bot。用于 @ 判定。
BOT_USERNAME = "my_muse_bot"
# Bot 的数字 ID, 可选。有它时引用判定更准 (不依赖 username)。
# 获取方式: 给 @userinfobot 发消息, 或看 webhook 里 reply_to_message.from.id
BOT_ID = ""
# 每次 poll 最多返回条数, 默认 10
POLL_DEFAULT_LIMIT = "10"
# 最大重试次数, 超过进 dead (死信), 不再自动拉取
MAX_ATTEMPTS = "5"

# 敏感值不要写在这里, 用 wrangler secret put 设置:
#   wrangler secret put WEBHOOK_SECRET   # Telegram setWebhook 的 secret_token, 建议 32+ 随机字符
#   wrangler secret put POLLER_TOKEN     # 拉取时的 Bearer Token, 建议 32+ 随机字符
#   wrangler secret put BOT_TOKEN        # 仅 /admin/set-webhook 需要, 平时 Worker 不调 Bot API
